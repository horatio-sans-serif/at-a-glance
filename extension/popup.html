<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Glance Settings</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup">
      <header>
        <h1>Glance</h1>
        <button id="analyzeBtn" class="primary-btn">Analyze This Page</button>
      </header>

      <section>
        <h2>User Profile</h2>
        <textarea
          id="userProfile"
          rows="4"
          placeholder="Your interests, role, tech stack..."
        ></textarea>
      </section>

      <section>
        <h2>Ollama</h2>
        <div class="field">
          <label>Endpoint</label>
          <input
            type="text"
            id="ollamaEndpoint"
            placeholder="http://localhost:11434"
          />
        </div>
        <div class="field">
          <label>Model</label>
          <input type="text" id="ollamaModel" placeholder="qwen3" />
        </div>
      </section>

      <section>
        <h2>Auto-Show</h2>
        <div class="field row">
          <label>Enabled</label>
          <input type="checkbox" id="autoShow" />
        </div>
        <div id="autoShowConfig" class="indent">
          <p class="hint">
            If include patterns exist, URL must match at least one. Exclude
            patterns always skip matching URLs.
          </p>
          <div class="pattern-group">
            <h3>Include patterns</h3>
            <div id="includePatternsList"></div>
            <div class="field row">
              <input
                type="text"
                id="newIncludePattern"
                placeholder="https://github.com/*"
              />
              <button id="addIncludeBtn" class="small-btn">Add</button>
            </div>
          </div>
          <div class="pattern-group">
            <h3>Exclude patterns</h3>
            <div id="excludePatternsList"></div>
            <div class="field row">
              <input
                type="text"
                id="newExcludePattern"
                placeholder="https://mail.google.com/*"
              />
              <button id="addExcludeBtn" class="small-btn">Add</button>
            </div>
          </div>
        </div>
      </section>

      <section>
        <h2>Bookmark Server</h2>
        <div class="field">
          <label>Endpoint</label>
          <input
            type="text"
            id="bookmarkEndpoint"
            placeholder="http://localhost:3377"
          />
        </div>
      </section>

      <div class="status" id="status"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
